services:
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: [mail]
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
    mem_limit: 128m
    pids_limit: 64

  db:
    image: mysql:8.4
    command: ["--log-bin-trust-function-creators=ON"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MySQL root password}
      MYSQL_DATABASE: done_db
      MYSQL_USER: done_admin
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?Run scripts/init-env.sh first}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - done-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --user=$$MYSQL_USER --database=$$MYSQL_DATABASE --execute='SELECT 1' --silent > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:mysql://db:3306/done_db
      DATABASE_USER: done_admin
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Run scripts/init-env.sh first}
      JWT_SECRET: ${JWT_SECRET:?Run scripts/init-env.sh first}
      JWT_ISSUER: ${JWT_ISSUER:-done-api}
      RECOVERY_ENABLED: ${RECOVERY_ENABLED:-false}
      RECOVERY_FROM: ${RECOVERY_FROM:-security@done.example}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      APPLE_ENABLED: ${APPLE_ENABLED:-false}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-ro.done.app}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY_PATH: /run/secrets/AuthKey.p8
      APPLE_ENCRYPTION_KEY: ${APPLE_ENCRYPTION_KEY:-}
      APPLE_WEB_CLIENT_ID: ${APPLE_WEB_CLIENT_ID:-}
      APPLE_WEB_REDIRECT_URI: ${APPLE_WEB_REDIRECT_URI:-}
      PUBLIC_SITE_MOCK: ${PUBLIC_SITE_MOCK:-true}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:8080}
      OPERATOR_NAME: ${OPERATOR_NAME:-DONE Demo Operator}
      OPERATOR_ADDRESS: ${OPERATOR_ADDRESS:-Demo address}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@done.example}
      PRIVACY_EMAIL: ${PRIVACY_EMAIL:-privacy@done.example}
      HOSTING_REGION: ${HOSTING_REGION:-Demo environment}
      DATA_PROCESSORS: ${DATA_PROCESSORS:-Demo provider}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      ALLOW_ANONYMOUS_SHARING: ${ALLOW_ANONYMOUS_SHARING:-true}
    volumes:
      - ./secrets:/run/secrets:ro
    restart: unless-stopped
volumes:
  done-mysql:
