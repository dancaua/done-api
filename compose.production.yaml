services:
  db:
    image: mysql:8.4
    command: ["--log-bin-trust-function-creators=ON"]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MySQL root password}
      MYSQL_DATABASE: done_db
      MYSQL_USER: ${MIGRATION_DATABASE_USER:-doadmin}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?Set production database password}
      RUNTIME_DATABASE_PASSWORD: ${RUNTIME_DATABASE_PASSWORD:?Set runtime database password}
    volumes:
      - done-mysql:/var/lib/mysql
      - ./deploy/provision-runtime-role.sh:/opt/done/provision-runtime-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --user=$$MYSQL_USER --database=$$MYSQL_DATABASE --execute='SELECT 1' --silent > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    restart: unless-stopped
    stop_grace_period: 30s
  api:
    build: .
    mem_limit: 1024m
    cpus: 2.0
    pids_limit: 256
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      DATABASE_URL: jdbc:mysql://db:3306/done_db
      DATABASE_USER: done_runtime
      DATABASE_PASSWORD: ${RUNTIME_DATABASE_PASSWORD:?Set runtime database password}
      MIGRATION_DATABASE_USER: ${MIGRATION_DATABASE_USER:-doadmin}
      MIGRATION_DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set production database password}
      JWT_SECRET: ${JWT_SECRET:?Set production signing key}
      JWT_ISSUER: ${JWT_ISSUER:-done-api}
      RECOVERY_ENABLED: 'true'
      RECOVERY_FROM: ${RECOVERY_FROM:?Set verified sender email}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP host}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP username}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP password}
      SMTP_AUTH: 'true'
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set public HTTPS origin}
      PUBLIC_SITE_MOCK: ${PUBLIC_SITE_MOCK:-false}
      OPERATOR_NAME: ${OPERATOR_NAME:?Set operator name}
      OPERATOR_ADDRESS: ${OPERATOR_ADDRESS:?Set operator address}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:?Set support contact}
      PRIVACY_EMAIL: ${PRIVACY_EMAIL:?Set privacy contact}
      HOSTING_REGION: ${HOSTING_REGION:?Set hosting region}
      DATA_PROCESSORS: ${DATA_PROCESSORS:?Set actual processors}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      ALLOW_ANONYMOUS_SHARING: ${ALLOW_ANONYMOUS_SHARING:-false}
      APPLE_ENABLED: ${APPLE_ENABLED:-false}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-ro.done.app}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY_PATH: /run/secrets/AuthKey.p8
      APPLE_ENCRYPTION_KEY: ${APPLE_ENCRYPTION_KEY:-}
      APPLE_WEB_CLIENT_ID: ${APPLE_WEB_CLIENT_ID:-}
      APPLE_WEB_REDIRECT_URI: ${APPLE_WEB_REDIRECT_URI:-}
      # Trust only this stack's Caddy, never an arbitrary Forwarded header.
      FORWARD_HEADERS_STRATEGY: native
      TRUSTED_PROXY_REGEX: '172\.30\.80\.2'
    volumes:
      - ./secrets:/run/secrets:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    restart: unless-stopped
    stop_grace_period: 30s
  web:
    image: caddy:2-alpine
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set real public domain}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api]
    networks:
      backend:
        ipv4_address: 172.30.80.2
    restart: unless-stopped
networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.80.0/24
volumes:
  done-mysql:
  caddy-data:
  caddy-config:
