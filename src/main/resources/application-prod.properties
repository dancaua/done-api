spring.config.import=
spring.datasource.hikari.data-source-properties.sslMode=${DATABASE_SSL_MODE:REQUIRED}
spring.flyway.user=${MIGRATION_DATABASE_USER}
spring.flyway.password=${MIGRATION_DATABASE_PASSWORD}
# Real contacts and an HTTPS public origin are enforced by SiteConfiguration.
app.site.mock=${PUBLIC_SITE_MOCK:false}
app.sharing.allow-anonymous=${ALLOW_ANONYMOUS_SHARING:false}
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXY_REGEX:}
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto

spring.flyway.jdbc-properties.sslMode=${DATABASE_SSL_MODE:REQUIRED}
spring.flyway.jdbc-properties.allowPublicKeyRetrieval=false
spring.flyway.jdbc-properties.allowLoadLocalInfile=false
spring.flyway.jdbc-properties.allowMultiQueries=false
