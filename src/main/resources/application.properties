spring.application.name=done-api
server.port=${PORT:8080}
server.forward-headers-strategy=none
server.error.include-message=never
server.tomcat.max-http-form-post-size=64KB
server.max-http-request-header-size=16KB
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/done}
spring.datasource.username=${DATABASE_USER:done}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.mapper.accept-case-insensitive-enums=false
app.auth.issuer=${JWT_ISSUER:done-api}
app.auth.audience=done-apple
app.auth.secret=${JWT_SECRET}
app.auth.access-ttl=PT15M
app.auth.refresh-ttl=P30D
app.apple.enabled=${APPLE_ENABLED:false}
app.apple.client-id=${APPLE_CLIENT_ID:ro.done.app}
app.apple.team-id=${APPLE_TEAM_ID:}
app.apple.key-id=${APPLE_KEY_ID:}
app.apple.private-key-path=${APPLE_PRIVATE_KEY_PATH:}
app.apple.encryption-key=${APPLE_ENCRYPTION_KEY:}
app.apple.jwk-set-uri=https://appleid.apple.com/auth/keys
app.apple.token-uri=https://appleid.apple.com/auth/token
app.apple.revoke-uri=https://appleid.apple.com/auth/revoke
app.jobs.enabled=true
app.jobs.interval-ms=30000

app.apple.web-client-id=${APPLE_WEB_CLIENT_ID:}
app.apple.web-redirect-uri=${APPLE_WEB_REDIRECT_URI:}

app.site.mock=${PUBLIC_SITE_MOCK:true}
app.site.origin=${PUBLIC_ORIGIN:http://127.0.0.1:8080}
app.site.operator-name=${OPERATOR_NAME:DONE Demo Operator}
app.site.operator-address=${OPERATOR_ADDRESS:Demo address - replace before publication}
app.site.support-email=${SUPPORT_EMAIL:support@done.example}
app.site.privacy-email=${PRIVACY_EMAIL:privacy@done.example}
app.site.hosting-region=${HOSTING_REGION:Demo environment - not publicly hosted}
app.site.processors=${DATA_PROCESSORS:Demo hosting provider - replace before publication}
app.site.backup-retention-days=${BACKUP_RETENTION_DAYS:30}
app.sharing.allow-anonymous=${ALLOW_ANONYMOUS_SHARING:true}
app.sharing.ttl=P7D
app.sharing.maximum-anonymous-shares=10000

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
management.endpoint.health.probes.enabled=true
